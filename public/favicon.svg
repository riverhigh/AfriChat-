<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" />
      <stop offset="50%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#090514" />
    </linearGradient>
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" />

  <!-- Outer Glow Chat Bubble -->
  <path d="M128 144 C128 108.6 156.6 80 192 80 L320 80 C355.4 80 384 108.6 384 144 L384 272 C384 307.4 355.4 336 320 336 L216 336 L144 396 L144 336 C134.4 336 128 329.6 128 320 Z" fill="url(#bubbleGrad)" filter="url(#glow)" opacity="0.3" />

  <!-- Main Chat Bubble -->
  <path d="M128 144 C128 108.6 156.6 80 192 80 L320 80 C355.4 80 384 108.6 384 144 L384 272 C384 307.4 355.4 336 320 336 L216 336 L144 396 L144 336 C134.4 336 128 329.6 128 320 Z" fill="url(#bubbleGrad)" />

  <!-- Stylized African Continent / Connection Node Inside Bubble -->
  <!-- Stylized Africa Path -->
  <path d="M220 130 C250 130 290 140 295 165 C300 185 275 200 270 215 C265 230 250 255 245 275 C242 288 235 292 230 285 C222 272 220 250 212 240 C202 228 185 220 185 205 C185 190 200 180 205 165 C210 150 210 130 220 130 Z" fill="#ffffff" opacity="0.95" />

  <!-- Emerald Verification / Online Node Pill -->
  <circle cx="360" cy="120" r="32" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="6" />
  <path d="M350 120 L357 127 L372 112" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Subtle Gold Wave Accent at bottom -->
  <path d="M190 290 C220 280 250 310 280 295" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round" opacity="0.9" />
</svg>
