      @keyframes agcBootSpin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body class="bg-[#06020d] antialiased selection:bg-purple-500 selection:text-white">
    <div id="root">
      <div data-agc-boot="1" style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:linear-gradient(145deg,#06020d 0%,#0d0520 60%,#12063a 100%);color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center">
        <div style="width:88px;height:88px;border-radius:24px;overflow:hidden;box-shadow:0 0 40px rgba(139,92,246,0.45);margin-bottom:18px;background:#1a0b3b;display:flex;align-items:center;justify-content:center">
          <img src="/icon-192.png" alt="AGC" width="88" height="88" style="width:100%;height:100%;object-fit:cover;display:block" />
        </div>
        <div style="font-size:28px;font-weight:800;letter-spacing:-0.02em;line-height:1">AGC</div>
        <div style="font-size:11px;color:rgba(167,139,250,0.88);margin-top:6px;letter-spacing:0.12em;text-transform:uppercase">Africa's Super App</div>
        <div style="margin-top:22px;width:24px;height:24px;border-radius:9999px;border:2.5px solid rgba(167,139,250,0.25);border-top-color:#a855f7;animation:agcBootSpin 0.8s linear infinite"></div>
        <div id="agc-boot-slow" style="display:none;margin-top:20px;max-width:290px">
          <p style="margin:0 0 12px;font-size:12px;color:#cbd5e1;line-height:1.45">Taking longer than usual to load. Refreshing or clearing cached scripts may help.</p>
          <button id="agc-boot-slow-btn" type="button" style="padding:10px 18px;border:0;border-radius:12px;background:linear-gradient(90deg,#9333ea,#4f46e5);color:#fff;font-weight:700;font-size:12px;cursor:pointer">Clear Cache &amp; Reload</button>
        </div>
      </div>
    </div>
    <script>
      // Global PWA BeforeInstallPrompt Event Cache
      window.deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPwaPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', () => {
        window.deferredPwaPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });

      // iOS device & standalone mode detection for safe-area insets
      (function() {
        var ua = window.navigator.userAgent.toLowerCase();
        var isIos = /iphone|ipad|ipod/.test(ua);
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        if (isIos) document.documentElement.classList.add('ios-device');
        if (isIos && isStandalone) document.documentElement.classList.add('ios-standalone');
      })();

      // Pre-mount recovery guard + stalled-boot watchdog:
      // Checks specifically for [data-agc-boot] inside #root (removed once React mounts).
      (function () {
        var handled = false;
        function isPreMount() {
          var root = document.getElementById('root');
          return !root || root.childElementCount === 0 || Boolean(root.querySelector('[data-agc-boot]'));
        }
        function clearSwAndCaches() {
          var tasks = [];
          try {
            if ('caches' in window) {
              tasks.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                }).catch(function () {})
              );
            }
            if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
              tasks.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                }).catch(function () {})
              );
            }
          } catch (_) {}
          return Promise.race([
            Promise.all(tasks),
            new Promise(function (resolve) { setTimeout(resolve, 1500); })
          ]);
        }
        function renderBootFallback(msg) {
          if (handled || !isPreMount()) return;
          handled = true;
          // Never wipe caches or force reload when device is offline (preserve offline PWA shell!)
          if (navigator.onLine === false) return;
          try {
            if (!sessionStorage.getItem('agc_boot_autoreload')) {
              sessionStorage.setItem('agc_boot_autoreload', '1');
              clearSwAndCaches().finally(function () { window.location.reload(); });
              return;
            }
          } catch (_) {}
          var root = document.getElementById('root');
          if (!root) return;
          root.innerHTML =
            '<div style="min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:#06020d;color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center">' +
              '<div style="max-width:340px;width:100%;background:#120826;border:1px solid rgba(168,85,247,0.35);border-radius:20px;padding:24px">' +
                '<h2 style="margin:0 0 8px;font-size:18px;font-weight:800">AfriChat Needs a Quick Refresh</h2>' +
                '<p style="margin:0 0 18px;font-size:12px;color:#cbd5e1;line-height:1.5">' + String(msg || 'A cached script could not load cleanly.') + '</p>' +
                '<button id="agc-boot-reload" style="width:100%;padding:12px 16px;border:0;border-radius:12px;background:linear-gradient(90deg,#9333ea,#4f46e5);color:#fff;font-weight:700;font-size:13px;cursor:pointer">Clear Cache &amp; Reload</button>' +
              '</div>' +
            '</div>';
          var btn = document.getElementById('agc-boot-reload');
          if (btn) {
            btn.addEventListener('click', function () {
              try { sessionStorage.removeItem('agc_boot_autoreload'); } catch (_) {}
              clearSwAndCaches().finally(function () { window.location.reload(); });
            });
          }
        }
        window.addEventListener('error', function (ev) {
          if (isPreMount()) {
            var target = ev && ev.target;
            // Ignore resource errors on stylesheets, images, media, and external third-party scripts
            if (target && target !== window && target.tagName) {
              var tag = String(target.tagName).toUpperCase();
              if (tag !== 'SCRIPT') return;
              if (target.src && target.src.indexOf(window.location.origin) !== 0) return;
            }
            renderBootFallback(ev && ev.message ? ev.message : 'Startup error');
          }
        }, true);
        window.addEventListener('unhandledrejection', function (ev) {
          if (isPreMount()) {
            var reason = ev && ev.reason ? (ev.reason.message || String(ev.reason)) : '';
            // Only recover on genuine JS module/chunk failures, NEVER generic background API fetches
            if (/Failed to fetch dynamically imported module|Importing a module script failed|Loading chunk|ChunkLoadError|Outdated Optimize Dep/i.test(reason)) {
              renderBootFallback(reason);
            }
          }
        });
        // If React hasn't replaced [data-agc-boot] within 12s, surface manual recovery button
        setTimeout(function () {
          if (!isPreMount()) return;
          var slowBox = document.getElementById('agc-boot-slow');
          if (slowBox) slowBox.style.display = 'block';
          var slowBtn = document.getElementById('agc-boot-slow-btn');
          if (slowBtn) {
            slowBtn.addEventListener('click', function () {
              try { sessionStorage.removeItem('agc_boot_autoreload'); } catch (_) {}
              clearSwAndCaches().finally(function () { window.location.reload(); });
            });
          }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
