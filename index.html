    <link rel="icon" type="image/png" href="/icon-192.png" />

    <!-- Google Fonts -->

  <body class="bg-slate-100 dark:bg-black antialiased selection:bg-purple-500 selection:text-white">
    <div id="root"></div>
    <script>
      // Global PWA BeforeInstallPrompt Event Cache
      window.deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPwaPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', () => {
        window.deferredPwaPrompt = null;
        window.dispatchEvent(new CustomEvent('pwa-installed'));
      });

      // iOS device & standalone mode detection for safe-area insets
      (function() {
        var ua = window.navigator.userAgent.toLowerCase();
        var isIos = /iphone|ipad|ipod/.test(ua);
        var isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        if (isIos) document.documentElement.classList.add('ios-device');
        if (isIos && isStandalone) document.documentElement.classList.add('ios-standalone');
      })();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const isViteDev = Boolean(document.querySelector('script[src="/@vite/client"], script[src="/src/main.tsx"]'));
          if (isViteDev) {
            navigator.serviceWorker.getRegistrations().then((regs) => {
              regs.forEach((r) => r.unregister());
            }).catch(() => {});
            if ('caches' in window) {
              caches.keys().then((keys) => keys.forEach((k) => caches.delete(k))).catch(() => {});
            }
            return;
          }
          navigator.serviceWorker.register('/sw.js', { updateViaCache: 'none' }).then((reg) => {
            reg.update().catch(() => {});
          }).catch((err) => {
            console.warn('SW registration skipped:', err);
          });
        });
      }

      // Pre-mount recovery guard: if top-level module evaluation fails before React mounts into #root,
      // auto-clear SW/caches once or render a clean Reload UI instead of a blank white page.
      (function () {
        var handled = false;
        function renderBootFallback(msg) {
          if (handled) return;
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          handled = true;
          try {
            if (!sessionStorage.getItem('agc_boot_autoreload')) {
              sessionStorage.setItem('agc_boot_autoreload', '1');
              if ('caches' in window) {
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                }).finally(function () { window.location.reload(); });
                return;
              }
              window.location.reload();
              return;
            }
          } catch (_) {}
          if (!root) return;
          root.innerHTML =
            '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#06020d;color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center">' +
              '<div style="max-width:340px;width:100%;background:#120826;border:1px solid rgba(168,85,247,0.35);border-radius:20px;padding:24px">' +
                '<h2 style="margin:0 0 8px;font-size:18px;font-weight:800">AfriChat Needs a Quick Refresh</h2>' +
                '<p style="margin:0 0 18px;font-size:12px;color:#cbd5e1;line-height:1.5">' + String(msg || 'A cached script could not load cleanly.') + '</p>' +
                '<button id="agc-boot-reload" style="width:100%;padding:12px 16px;border:0;border-radius:12px;background:linear-gradient(90deg,#9333ea,#4f46e5);color:#fff;font-weight:700;font-size:13px;cursor:pointer">Reload App</button>' +
              '</div>' +
            '</div>';
          var btn = document.getElementById('agc-boot-reload');
          if (btn) {
            btn.addEventListener('click', function () {
              try { sessionStorage.removeItem('agc_boot_autoreload'); } catch (_) {}
              if ('caches' in window) {
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                }).finally(function () { window.location.reload(); });
              } else {
                window.location.reload();
              }
            });
          }
        }
        window.addEventListener('error', function (ev) {
          var root = document.getElementById('root');
          if (!root || root.childElementCount === 0) {
            renderBootFallback(ev && ev.message ? ev.message : 'Startup error');
          }
        });
        window.addEventListener('unhandledrejection', function (ev) {
          var root = document.getElementById('root');
          if (!root || root.childElementCount === 0) {
            var reason = ev && ev.reason ? (ev.reason.message || String(ev.reason)) : '';
            if (/import|module|chunk|fetch|Outdated/i.test(reason)) {
              renderBootFallback(reason);
            }
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
